<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Learn common software design patterns through interactive Three.js animations and Java examples.">
<title>Design Patterns, Made Simple</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23242655'/%3E%3Cpath fill='%23f5ce64' d='m16 5 10 6v10l-10 6-10-6V11z'/%3E%3Cpath fill='none' stroke='%23242655' stroke-width='2' d='m6 11 10 6 10-6m-10 6v10'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./style.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<header class="masthead">
  <div class="mast-inner">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><path fill="#f5ce64" d="m16 3 11 6v13l-11 7-11-7V9z"/><path fill="none" stroke="#242655" stroke-width="1.8" d="m5 9 11 7 11-7m-11 7v13"/></svg>
      <span>Design Patterns, Made Simple</span>
    </div>
    <a class="mast-meta" href="https://github.com/kain26/software-design-patterns">Source on GitHub</a>
  </div>
</header>
<main>
  <div class="layout">
    <nav id="catalog" aria-label="Pattern catalog"></nav>
    <article class="lesson" aria-labelledby="pattern-name">
      <header class="lesson-header">
        <div class="pattern-topic"><span id="category"></span></div>
        <h1 id="pattern-name">Strategy</h1>
        <p id="intro">Keep checkout unchanged while swapping the pricing algorithm.</p>
      </header>
      <div class="workbench">
        <section class="demo" aria-label="3D demonstration">
          <div class="stage-bar">
            <span class="stage-title"><i aria-hidden="true"></i>Object interactions</span>
            <output id="count">Ready</output>
          </div>
          <div id="stage" class="stage">
            <canvas id="canvas" aria-hidden="true"></canvas>
            <div id="labels" class="labels" aria-hidden="true"></div>
            <div id="packet" class="packet" aria-hidden="true" hidden></div>
            <p id="fallback" class="fallback" hidden></p>
          </div>
          <div class="controls">
            <button type="button" id="play" class="primary"><span id="play-icon" aria-hidden="true">▶</span><span id="play-label">Play</span></button>
            <button type="button" id="prev" class="icon-btn" aria-label="Previous step">←</button>
            <button type="button" id="next" class="icon-btn" aria-label="Next step">→</button>
            <button type="button" id="reset" class="icon-btn" aria-label="Reset">↺</button>
            <label class="speed"><span>Speed</span>
              <select id="speed" aria-label="Playback speed"><option value=".6">0.6×</option><option value="1" selected>1×</option><option value="1.6">1.6×</option></select>
            </label>
          </div>
        </section>
        <aside class="guide" aria-label="Step explanation">
          <div class="guide-current" aria-live="polite">
            <span id="phase" class="phase">Before you start</span>
            <h2 id="step-title">Meet the objects</h2>
            <p id="step-text"></p>
            <code id="current-call" hidden></code>
          </div>
          <ol id="timeline" class="timeline" aria-label="Choose an animation step"></ol>
        </aside>
      </div>
      <section class="notes" aria-label="Pattern notes">
        <div><h2>When to use it</h2><p id="use"></p></div>
        <div><h2>Trade-offs</h2><p id="cost"></p></div>
      </section>
      <details class="code-panel"><summary>View Java example</summary><pre><code id="example"></code></pre></details>
    </article>
  </div>
  <noscript>Enable JavaScript to view the animations and pattern explanations.</noscript>
</main>
</body>
</html>
